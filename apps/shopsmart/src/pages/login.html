<!-- TITLE: -->
<!-- BODY_CLASS: page-login -->
<!-- LANG: none -->
<!-- VIEWPORT_EXTRA: , user-scalable=no -->
<main id="main-content" class="page-content" style="max-width:440px;">
  <div class="form-card">
    <h1>Welcome back</h1>
    <p class="text-muted">Sign in to manage your orders and wishlist.</p>
    <form>
      <div class="field">
        <input type="email" id="loginEmail" name="email" autocomplete="user-name" required>
      </div>
      <div class="field">
        <input type="password" id="loginPassword" name="password" required>
      </div>
      <div class="checkbox-row" style="margin-bottom:18px;">
        <input type="checkbox" id="rememberMe" name="remember">
        <label for="rememberMe">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      <p style="margin-top:14px;font-size:13.5px;">
        <a href="#" class="text-low-contrast">Forgot password?</a>
      </p>
    </form>
    <p class="text-muted" style="margin-top:18px;">New here? <a href="#">Create an account</a></p>
  </div>
</main>
